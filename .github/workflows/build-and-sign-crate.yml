name: Build and Sign

on:
  workflow_call:
    inputs:
      crate:
        required: true
        type: string
        description: "Which crate to build"

    secrets:
      SIGNPATH_API_TOKEN:
        description: 'API key for submitting Signpath signing requests'
        required: true

permissions: { }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            host: ubuntu-latest
            filename: ${{ inputs.crate }}.dll

          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            filename: lib${{ inputs.crate }}.so

          - target: aarch64-apple-darwin
            host: macos-latest
            filename: lib${{ inputs.crate }}.dylib

    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.host }}

    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Toolchain
        run: |
          DESIRED_TOOLCHAIN=$(sed -nr 's/^.*channel = "(.*)".*$/\1/p' <rust-toolchain.toml | tr -d '\n')
          rustup toolchain install $DESIRED_TOOLCHAIN --profile minimal --no-self-update --target ${{ matrix.target }}

      - name: Toolchain Version
        run: rustc --version --verbose

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.target }}"

      - name: Set up MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64-win32

      - name: Build
        run: cargo build --package ${{ inputs.crate }} --release --target ${{ matrix.target }}

      - name: Determine Artifact Path
        id: determine-artifact-path
        run: |
          ARTIFACT_NAME=$(echo '${{ matrix.filename }}' | sed 's/-/_/g')
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" > $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: ${{ inputs.crate }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ steps.determine-artifact-path.outputs.ARTIFACT_NAME }}
          if-no-files-found: 'error'

  sign_windows:
    name: Sign for Windows
    runs-on: ubuntu-latest
    needs: build

    env:
      TARGET_TO_SIGN: x86_64-pc-windows-gnu

    steps:
      - name: Sign
        uses: signpath/github-action-submit-signing-request@v3
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: |
            ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: "${{ inputs.crate }}-${{ env.TARGET_TO_SIGN }}"
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.crate }}-${{ env.TARGET_TO_SIGN }}-signed
          path: 'signed'
          if-no-files-found: 'error'