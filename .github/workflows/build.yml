name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_loader:
    name: Build Loader
    uses: ./.github/workflows/build-and-sign-crate.yml
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    with:
      crate: 'gdpatch-loader'
      artifact_configuration_slug: 'loader'
      # signing_policy: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
      signing_policy: 'test-signing'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build_loader

    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: 'false'

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gdpatch-loader-*
          merge-multiple: true

      - name: Print changelog
        run: |
          git tag --list --format='%(contents:body)' ${{ github.ref_name }} > ${{ github.workspace }}-CHANGELOG.md
          sed -i -z 's/^\s*//; s/\s*$//' ${{ github.workspace }}-CHANGELOG.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.md
          working_directory: dist
          files: "*.*"
