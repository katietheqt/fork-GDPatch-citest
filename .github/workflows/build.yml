name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_loader:
    name: Build Loader
    uses: ./.github/workflows/build-and-sign-crate.yml
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    with:
      crate: 'gdpatch_loader'
